<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VoteSecure</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="home.html" class="logo-area">
                🗳️ <span>VoteSecure</span>
            </a>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="login.html" class="nav-link active">Login</a></li>
                <li><a href="register.html" class="nav-link">Register</a></li>
            </ul>
        </div>
    </header>

    <div class="auth-wrapper animate-fade-in">
        <div class="glass-panel">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your secure voting dashboard</p>
            </div>

            <!-- Visual Toggle to set user expectations, unified login is handled by the backend API -->
            <div class="auth-toggle">
                <button type="button" class="auth-toggle-btn active" id="toggle-voter" onclick="selectRole('voter')">Voter</button>
                <button type="button" class="auth-toggle-btn" id="toggle-admin" onclick="selectRole('admin')">Admin</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username" id="username-label">Email or Voter ID</label>
                    <input type="text" id="username" name="username" class="input-control" placeholder="Enter your Email or Voter ID" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Secure Login</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Don't have a voter account? <a href="register.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Register here</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let selectedRole = 'voter';

        document.addEventListener('DOMContentLoaded', async () => {
            // If already logged in, redirect away from login page
            await checkAuth();
        });

        function selectRole(role) {
            selectedRole = role;
            const voterBtn = document.getElementById('toggle-voter');
            const adminBtn = document.getElementById('toggle-admin');
            const usernameLabel = document.getElementById('username-label');
            const usernameInput = document.getElementById('username');

            if (role === 'admin') {
                voterBtn.classList.remove('active');
                adminBtn.classList.add('active');
                usernameLabel.innerText = "Admin Email";
                usernameInput.placeholder = "VARUN7@admin.com";
            } else {
                voterBtn.classList.add('active');
                adminBtn.classList.remove('active');
                usernameLabel.innerText = "Email or Voter ID";
                usernameInput.placeholder = "Enter your Email or Voter ID";
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);

            const result = await API.post('api/auth/login.php', formData);

            if (result.success) {
                showToast(result.message, 'success');
                sessionStorage.setItem('user', JSON.stringify(result.user));
                
                // Redirect based on role returned by server
                setTimeout(() => {
                    if (result.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1000);
            } else {
                showToast(result.message, 'error');
            }
        });
    </script>
</body>
</html>
