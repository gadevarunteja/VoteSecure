<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - VoteSecure</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="home.html" class="logo-area">
                🗳️ <span>VoteSecure</span>
            </a>
            <ul class="nav-menu">
                <li><a href="home.html" class="nav-link">Home</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="profile.html" class="nav-link active">Profile</a></li>
                <li><a href="#" onclick="performLogout()" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid" style="grid-template-columns: 1.2fr 1.8fr; align-items: start;">
            <!-- Profile Settings Glass Card -->
            <div class="glass-panel animate-fade-in" style="padding: 2rem;">
                <h2 style="font-weight: 800; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Voter Profile</h2>
                
                <form id="profile-form">
                    <div class="form-group">
                        <label for="voter_id">Voter ID (Read-Only)</label>
                        <input type="text" id="voter_id" class="input-control" readonly style="opacity: 0.6; cursor: not-allowed;">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address (Read-Only)</label>
                        <input type="text" id="email" class="input-control" readonly style="opacity: 0.6; cursor: not-allowed;">
                    </div>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" class="input-control" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" class="input-control" pattern="[0-9]{10}" title="Ten digit mobile number" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" class="input-control" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Change Password (Leave blank to keep current)</label>
                        <input type="password" id="password" name="password" class="input-control" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Profile</button>
                </form>
            </div>

            <!-- Voting History List Card -->
            <div class="glass-panel animate-fade-in" style="padding: 2rem;">
                <h2 style="font-weight: 800; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">Your Voting Receipts</h2>
                
                <div id="history-list" style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Dynamically populated voting log receipts -->
                    <div class="glass-card empty-state" style="padding: 2rem;">
                        <div class="empty-icon">⏳</div>
                        <p>Loading history...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth();
            if (!user) return;

            // Check if user is admin to customize UI layout
            if (user.role === 'admin') {
                // Adjust Navigation Menu for Admin
                const navMenu = document.querySelector('.nav-menu');
                if (navMenu) {
                    navMenu.innerHTML = `
                        <li><a href="home.html" class="nav-link">Home</a></li>
                        <li><a href="admin.html" class="nav-link">Admin Panel</a></li>
                        <li><a href="profile.html" class="nav-link active">Profile</a></li>
                        <li><a href="#" onclick="performLogout()" class="nav-link">Logout</a></li>
                    `;
                }

                // Hide Voting receipts panel
                const historyPanel = document.querySelector('.dashboard-grid > div:nth-child(2)');
                if (historyPanel) historyPanel.style.display = 'none';

                // Center profile form and make it full width
                const dashboardGrid = document.querySelector('.dashboard-grid');
                if (dashboardGrid) {
                    dashboardGrid.style.gridTemplateColumns = '1fr';
                    dashboardGrid.style.maxWidth = '600px';
                    dashboardGrid.style.margin = '0 auto';
                }

                // Update heading
                const profileHeading = document.querySelector('.glass-panel h2');
                if (profileHeading) profileHeading.textContent = 'Admin Profile';
            }

            // Load Profile details
            document.getElementById('name').value = user.name;
            document.getElementById('voter_id').value = user.voter_id;
            document.getElementById('email').value = user.email;
            document.getElementById('mobile').value = user.mobile;
            document.getElementById('dob').value = user.dob;

            // Enforce DOB constraints
            const dobInput = document.getElementById('dob');
            const eighteenYearsAgo = new Date();
            eighteenYearsAgo.setFullYear(eighteenYearsAgo.getFullYear() - 18);
            dobInput.max = eighteenYearsAgo.toISOString().split('T')[0];

            // Load History if voter
            if (user.role !== 'admin') {
                loadVotingHistory();
            }
        });

        document.getElementById('profile-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);

            const result = await API.post('api/auth/profile.php', formData);

            if (result.success) {
                showToast(result.message, 'success');
                // Refresh local session details
                sessionStorage.setItem('user', JSON.stringify(result.user));
            } else {
                showToast(result.message, 'error');
            }
        });

        async function loadVotingHistory() {
            const historyList = document.getElementById('history-list');
            const data = await API.get('api/vote/history.php');

            if (!data.success) {
                historyList.innerHTML = `
                    <div class="glass-card empty-state" style="border-color: var(--danger-color);">
                        <div class="empty-icon">⚠️</div>
                        <p>Failed to retrieve voting log.</p>
                    </div>
                `;
                return;
            }

            const history = data.history;
            if (history.length === 0) {
                historyList.innerHTML = `
                    <div class="glass-card empty-state">
                        <div class="empty-icon">🗳️</div>
                        <h3>No Votes Cast Yet</h3>
                        <p>When you participate in elections, your voting receipts will appear here securely.</p>
                    </div>
                `;
                return;
            }

            historyList.innerHTML = '';
            history.forEach(log => {
                const castedDate = new Date(log.casted_at).toLocaleString('en-IN', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });

                const item = document.createElement('div');
                item.className = 'glass-card';
                item.style.padding = '1.25rem';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                item.style.flexWrap = 'wrap';
                item.style.gap = '1rem';

                item.innerHTML = `
                    <div>
                        <h4 style="font-weight: 700; font-size: 1.05rem; margin-bottom: 0.25rem;">${log.election_title}</h4>
                        <small style="color: var(--text-secondary);">Casted At: <strong>${castedDate}</strong></small>
                    </div>
                    <div style="background: rgba(79, 70, 229, 0.08); border: 1px solid rgba(79, 70, 229, 0.2); padding: 0.5rem 1rem; border-radius: var(--border-radius-sm); text-align: right;">
                        <small style="color: var(--text-secondary); display: block; font-size: 0.75rem; text-transform: uppercase;">Choice Casted</small>
                        <strong style="color: var(--text-primary); font-size: 0.95rem;">${log.candidate_name}</strong>
                        <span style="color: var(--text-secondary); font-size: 0.85rem; display: block;">(${log.candidate_party})</span>
                    </div>
                `;
                historyList.appendChild(item);
            });
        }
    </script>
</body>
</html>
